name: Enterprise CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
  GROQ_API_KEY: gsk_dummy_key_for_ci_pipeline
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mock_ci_db
  DEMO_MODE_ENABLED: true

jobs:
  quality-gate:
    name: Type Check, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Type Check (TypeScript)
        run: npm run type-check

      - name: 🧹 Lint (ESLint)
        run: npm run lint

      - name: 🧪 Unit Tests (Vitest)
        run: npm run test

      - name: 🏗️ Production Build (Next.js)
        run: npm run build
